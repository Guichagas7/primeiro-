<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Ilustração de mapa com a localização do Café Mundi">
  <rect width="600" height="420" fill="#f3e6d3"/>

  <!-- quarteirões -->
  <g fill="#e6d2b5">
    <rect x="20" y="20" width="150" height="110" rx="10"/>
    <rect x="215" y="20" width="170" height="110" rx="10"/>
    <rect x="430" y="20" width="150" height="110" rx="10"/>
    <rect x="20" y="175" width="150" height="90" rx="10"/>
    <rect x="430" y="175" width="150" height="90" rx="10"/>
    <rect x="20" y="310" width="150" height="90" rx="10"/>
    <rect x="215" y="310" width="170" height="90" rx="10"/>
    <rect x="430" y="310" width="150" height="90" rx="10"/>
  </g>

  <!-- praça / área verde -->
  <rect x="215" y="175" width="170" height="90" rx="10" fill="#c9d8a8"/>
  <circle cx="300" cy="220" r="22" fill="#a9c27d"/>

  <!-- ruas -->
  <g fill="#ffffff">
    <rect x="0" y="140" width="600" height="25"/>
    <rect x="0" y="275" width="600" height="25"/>
    <rect x="180" y="0" width="25" height="420"/>
    <rect x="395" y="0" width="25" height="420"/>
  </g>
  <g stroke="#d4a373" stroke-width="2" stroke-dasharray="14 10">
    <line x1="0" y1="152" x2="600" y2="152"/>
    <line x1="0" y1="287" x2="600" y2="287"/>
    <line x1="192" y1="0" x2="192" y2="420"/>
    <line x1="407" y1="0" x2="407" y2="420"/>
  </g>

  <!-- nome da rua -->
  <text x="40" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6d4c41">Rua das Flores</text>

  <!-- marcador -->
  <ellipse cx="300" cy="158" rx="14" ry="5" fill="#3e2723" opacity="0.25"/>
  <path d="M300 156 C 270 118, 264 100, 264 86 A36 36 0 1 1 336 86 C 336 100, 330 118, 300 156 Z" fill="#3e2723"/>
  <circle cx="300" cy="86" r="22" fill="#d4a373"/>
  <path d="M288 80h20v12a6 6 0 0 1-6 6h-8a6 6 0 0 1-6-6z M308 83h4a4 4 0 0 1 0 8h-4" fill="none" stroke="#3e2723" stroke-width="3" stroke-linejoin="round"/>

  <!-- rótulo -->
  <rect x="236" y="176" width="128" height="26" rx="13" fill="#3e2723"/>
  <text x="300" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#d4a373">Café Mundi</text>
</svg>
